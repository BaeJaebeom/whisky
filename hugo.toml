baseURL = "https://baejaebeom.github.io/whisky/"
locale = "ko-KR"
defaultContentLanguage = "ko"
title = "위스키 노트"
timeZone = "Asia/Seoul"
disableKinds = ["rss"]
capitalizeListTitles = false
# 예약 발행 기능이 없으므로 날짜가 미래인 글도 바로 공개한다. (안 그러면 배포는 성공하는데 글이 안 나온다)
buildFuture = true

# 글 폴더의 원본 사진·파일은 내보내지 않는다. 템플릿이 실제로 쓴(줄인) 사진만 공개된다.
# 원본을 그대로 올리면 사진의 위치 정보(EXIF)와 본문에 안 쓴 파일까지 공개된다.
[[cascade]]
  [cascade.build]
    publishResources = false

# 글의 `태그:` 줄이 태그가 된다. 주소는 /tags/셰리/ 처럼 만든다.
[taxonomies]
  tag = "태그"

[permalinks.taxonomy]
  "태그" = "/tags/"

[permalinks.term]
  "태그" = "/tags/:slug/"

[caches.images]
  dir = ":cacheDir/images"

[imaging.jpeg]
  quality = 82
